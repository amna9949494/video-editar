<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07060d" />
  <title>Frameflow | AI video generation</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
          colors: { ink: { 950: '#07060d', 900: '#0c0b16', 800: '#13111f' } }
        }
      }
    };
  </script>

  <!-- Icons (Lucide) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="h-full bg-ink-950 font-sans text-slate-200 antialiased">
  <!-- Ambient background glow -->
  <div class="aurora" aria-hidden="true">
    <span class="orb orb-violet"></span>
    <span class="orb orb-blue"></span>
  </div>

  <div class="relative z-10 flex h-[100dvh] flex-col">
    <!-- Header -->
    <header class="glass relative z-20 flex items-center justify-between border-x-0 border-t-0 px-4 py-3 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="logo-mark" aria-hidden="true"><i data-lucide="clapperboard" class="h-5 w-5"></i></div>
        <div class="leading-tight">
          <h1 class="text-[15px] font-semibold text-white">Frameflow</h1>
          <p class="text-xs text-slate-400">Text and image to video</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="mode-badge" class="hidden rounded-full border border-amber-400/30 bg-amber-400/10 px-3 py-1 text-xs font-medium text-amber-200" title="Using the mock API. Set USE_MOCK to false in api.js to call your backend.">Demo mode</span>
        <span class="hidden rounded-full border border-violet-400/30 bg-violet-400/10 px-3 py-1 text-xs font-medium text-violet-200 sm:inline">Wan2.1</span>
        <button id="new-chat" type="button" class="ghost-btn">
          <i data-lucide="plus" class="h-4 w-4"></i>
          <span>New chat</span>
        </button>
      </div>
    </header>

    <!-- Conversation -->
    <main id="chat-scroll" class="scroll-area relative flex-1 overflow-y-auto">
      <div id="chat" class="mx-auto flex w-full max-w-3xl flex-col gap-8 px-4 pb-52 pt-8 sm:px-6" aria-live="polite" aria-label="Conversation"></div>

      <!-- Empty state (shown after "New chat") -->
      <section id="empty-state" class="mx-auto hidden w-full max-w-2xl flex-col items-center px-6 pb-52 pt-[14vh] text-center">
        <div class="logo-mark logo-mark-lg" aria-hidden="true"><i data-lucide="clapperboard" class="h-7 w-7"></i></div>
        <h2 class="mt-6 text-3xl font-semibold tracking-tight text-white sm:text-4xl">What should we film?</h2>
        <p class="mt-3 max-w-md text-slate-400">Describe a scene, or attach an image to bring it to life.</p>
        <div class="mt-8 flex flex-wrap justify-center gap-2.5">
          <button type="button" class="chip" data-suggestion="A lone astronaut walking across a red desert at dusk, dust drifting in the wind, cinematic">A lone astronaut in a red desert</button>
          <button type="button" class="chip" data-suggestion="Macro shot of rain drops hitting a neon-lit puddle, slow motion, shallow depth of field">Neon rain in slow motion</button>
          <button type="button" class="chip" data-suggestion="A fox leaping through fresh snow in a pine forest, soft morning light, tracking shot">A fox leaping through snow</button>
        </div>
      </section>
    </main>

    <!-- Floating composer -->
    <div class="composer-wrap pointer-events-none absolute inset-x-0 bottom-0 z-30 px-4 pt-16 sm:px-6">
      <div class="pointer-events-auto mx-auto w-full max-w-3xl">
        <form id="composer" class="glass-strong composer rounded-2xl p-2.5" autocomplete="off">
          <!-- Image preview -->
          <div id="attach-preview" class="hidden px-1.5 pb-3 pt-1">
            <div class="flex items-center gap-3">
              <div class="relative">
                <img id="attach-thumb" alt="Selected image preview" class="h-20 w-20 rounded-xl object-cover ring-1 ring-white/20" />
                <button id="attach-remove" type="button" class="remove-chip" aria-label="Remove image">
                  <i data-lucide="x" class="h-3.5 w-3.5"></i>
                </button>
              </div>
              <div class="min-w-0 text-sm">
                <p id="attach-name" class="truncate font-medium text-slate-200"></p>
                <p id="attach-size" class="text-xs text-slate-400"></p>
                <p class="mt-1 text-xs text-violet-300">This image will be animated into a video.</p>
              </div>
            </div>
          </div>

          <div class="flex items-end gap-2">
            <button id="attach-btn" type="button" class="icon-btn" aria-label="Attach an image" title="Attach an image">
              <i data-lucide="paperclip" class="h-5 w-5"></i>
            </button>
            <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" class="hidden" />

            <label for="prompt" class="sr-only">Video prompt</label>
            <textarea id="prompt" rows="1" maxlength="1000" placeholder="Describe your video, or attach an image to animate it"
              class="prompt-input max-h-[200px] min-h-[2.75rem] flex-1 resize-none bg-transparent px-2 py-[0.7rem] text-[15px] leading-6 text-slate-100 placeholder:text-slate-500 focus:outline-none"></textarea>

            <button id="send-btn" type="submit" class="send-btn" disabled aria-label="Generate video">
              <i data-lucide="sparkles" class="send-idle h-[18px] w-[18px]"></i>
              <i data-lucide="loader-circle" class="send-busy h-[18px] w-[18px]"></i>
              <span class="hidden sm:inline">Generate</span>
            </button>
          </div>

          <div class="flex flex-wrap items-center gap-2 px-1 pb-0.5 pt-2.5">
            <label class="sr-only" for="opt-ratio">Aspect ratio</label>
            <select id="opt-ratio" class="chip-select">
              <option value="16:9">16:9 landscape</option>
              <option value="9:16">9:16 portrait</option>
              <option value="1:1">1:1 square</option>
            </select>
            <label class="sr-only" for="opt-duration">Duration</label>
            <select id="opt-duration" class="chip-select">
              <option value="3">3 seconds</option>
              <option value="5" selected>5 seconds</option>
            </select>
            <span class="ml-auto hidden text-xs text-slate-500 md:inline">Enter to send, Shift + Enter for a new line</span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Drag and drop overlay -->
  <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
    <div class="drop-card">
      <i data-lucide="image-plus" class="h-8 w-8"></i>
      <p class="text-lg font-semibold text-white">Drop an image to animate it</p>
      <p class="text-sm text-slate-400">PNG, JPG, or WebP up to 10 MB</p>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toasts" class="pointer-events-none fixed right-4 top-4 z-50 flex flex-col gap-2" role="status" aria-live="polite"></div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
</body>
</html>
